# Render Blueprint: New + > Blueprint > pick this repo. Needs a paid instance because it uses a persistent disk.
services:
  - type: web
    name: daypilot
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: daypilot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_PASSWORD
        sync: false          # Render asks you for it during setup (8+ characters)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
